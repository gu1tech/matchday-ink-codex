name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev,ai,device]' build
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          python -m venv /tmp/matchday-wheel
          /tmp/matchday-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/matchday-wheel/bin/matchday-ink demo
          /tmp/matchday-wheel/bin/matchday-ink render --schedule build/demo.json
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli compile --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc firmware/MatchdayInk
